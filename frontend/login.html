<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Entri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #5B21B6;
      --primary-light: #7C3AED;
      --primary-dark: #3B0764;
      --accent: #F59E0B;
      --bg: #F5F3FF;
      --card: #FFFFFF;
      --text: #1E1B4B;
      --text-muted: #6B7280;
      --border: #DDD6FE;
      --success: #059669;
      --error: #DC2626;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      color: var(--text);
    }

    .hero-panel {
      background: linear-gradient(145deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
    }

    .hero-panel::before {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      top: -100px; right: -100px;
    }

    .hero-panel::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      background: rgba(245,158,11,0.08);
      border-radius: 50%;
      bottom: -80px; left: -60px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 60px;
      position: relative;
      z-index: 1;
      text-decoration: none;
    }

    .logo-diamond {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-diamond::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #F59E0B;
      transform: rotate(45deg);
      border-radius: 12px;
    }

    .logo-diamond img {
      position: relative;
      z-index: 1;
      height: 46px;
      filter: brightness(0);
    }

    .hero-content { position: relative; z-index: 1; }

    .hero-title {
      font-size: 42px;
      font-weight: 800;
      color: white;
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .hero-title span { color: var(--accent); }

    .hero-sub {
      font-size: 15px;
      color: rgba(255,255,255,0.65);
      line-height: 1.7;
      max-width: 340px;
      margin-bottom: 40px;
    }

    .security-badges {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 12px 16px;
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      font-weight: 500;
    }

    .badge-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    /* Right panel */
    .form-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 40px;
    }

    .form-card { width: 100%; max-width: 400px; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      margin-bottom: 32px;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--primary-light); }

    .form-card h2 {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .email-display {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 36px;
    }

    .email-display strong {
      color: var(--primary-light);
      font-weight: 600;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: white;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      letter-spacing: 2px;
    }

    input[type="password"]:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
      letter-spacing: 2px;
    }

    input[type="password"]::placeholder {
      color: #C4B5FD;
      letter-spacing: normal;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.2px;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(91, 33, 182, 0.4);
    }

    #status {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      min-height: 20px;
    }

    @media (max-width: 768px) {
      body { grid-template-columns: 1fr; }
      .hero-panel { display: none; }
      .form-panel { padding: 40px 24px; }
    }
  </style>
</head>
<body>

  <div class="hero-panel">
    <a class="logo" href="/homepage.html">
      <div class="logo-diamond"><img src="/static/assets/logo.png" alt="Entri"></div>
    </a>
    <div class="hero-content">
      <h1 class="hero-title">Welcome<br>back to <span>Entri.</span></h1>
      <p class="hero-sub">Sign in securely to access your verified identity profile and event tickets.</p>
      <div class="security-badges">
        <div class="badge">
          <span class="badge-icon">🔐</span>
          End-to-end encrypted session
        </div>
        <div class="badge">
          <span class="badge-icon">🛡️</span>
          Biometric identity verification
        </div>
        <div class="badge">
          <span class="badge-icon">⚡</span>
          Instant event access after login
        </div>
      </div>
    </div>
  </div>

  <div class="form-panel">
    <div class="form-card">
      <a class="back-link" href="/homepage.html">← Back</a>
      <h2>Sign In</h2>
      <p class="email-display" id="emailDisplay">Signing in as <strong id="emailLabel">—</strong></p>

      <form id="loginForm">
        <input type="hidden" id="email" value="">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter your password">
        <button type="submit">Sign In →</button>
      </form>
      <div id="status"></div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get("email") || "";
    document.getElementById("email").value = email;
    document.getElementById("emailLabel").textContent = email || "unknown";

    const form = document.getElementById("loginForm");
    const statusDiv = document.getElementById("status");

    form.onsubmit = async (e) => {
      e.preventDefault();
      statusDiv.style.color = "#7C3AED";
      statusDiv.textContent = "Signing in...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
          credentials: "include"
        });

        const data = await res.json();

        if (res.ok) {
          statusDiv.style.color = "#059669";
          statusDiv.textContent = "Login successful! Redirecting...";

          const redirectUrl = data.role === "organizer"
            ? "/organizer.html"
            : "/dashboard.html";

          setTimeout(() => { window.location.href = redirectUrl; }, 1000);
        } else {
          statusDiv.style.color = "#DC2626";
          statusDiv.textContent = `Error: ${data.detail || data.message}`;
        }
      } catch (error) {
        statusDiv.style.color = "#DC2626";
        statusDiv.textContent = `Error: ${error.message}`;
      }
    };
  </script>
</body>
</html>
