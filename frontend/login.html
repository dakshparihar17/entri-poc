<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Entri</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f4f6f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .login-card {
      background: white;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 320px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #222;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background: #0078ff;
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #005fcc;
    }
    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #0078ff;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Welcome Back 👋</h2>
    <form id="loginForm">
      <input type="hidden" id="email" value="">
      <label for="password">Password:</label><br>
      <input type="password" id="password" required placeholder="Enter your password"><br>
      <button type="submit">Login</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    document.getElementById("email").value = urlParams.get("email") || "";

    const form = document.getElementById("loginForm");
    const statusDiv = document.getElementById("status");

    form.onsubmit = async (e) => {
      e.preventDefault();
      statusDiv.textContent = "Logging in...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
          credentials: "include"
        });

        const data = await res.json();

        if (res.ok) {
          statusDiv.style.color = "green";
          statusDiv.textContent = "Login successful! Redirecting...";

          // Backend sends role info (user or organiser)
          const redirectUrl = data.role === "organizer"
            ? "/organizer.html"
            : "/dashboard.html";

          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 1000);
        } else {
          statusDiv.style.color = "red";
          statusDiv.textContent = `Error: ${data.detail || data.message}`;
        }
      } catch (error) {
        statusDiv.style.color = "red";
        statusDiv.textContent = `Error: ${error.message}`;
      }
    };
  </script>
</body>
</html>
