<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Entri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #030c16;
      --surface: #071828;
      --surface2: #0c1f32;
      --border: rgba(255,255,255,0.07);
      --accent: #0ea5e9;
      --accent2: #38bdf8;
      --green: #10b981;
      --text: #eef4ff;
      --muted: #5a7fa0;
    }

    html { background: #030c16; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(165deg, #030c16 0%, #020a13 55%, #040e1c 100%);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .hero-panel {
      background: linear-gradient(145deg, #020a13 0%, #071828 50%, #0c1f32 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }

    .hero-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 65% 55% at 15% 50%, rgba(14,165,233,0.14) 0%, transparent 65%),
                  radial-gradient(ellipse 40% 35% at 85% 15%, rgba(16,185,129,0.09) 0%, transparent 60%);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 60px;
      position: relative;
      z-index: 1;
      text-decoration: none;
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-content { position: relative; z-index: 1; }

    .hero-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 900;
      color: var(--text);
      line-height: 1.08;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
    }

    .hero-title span {
      background: linear-gradient(135deg, var(--accent2), var(--green));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.75;
      max-width: 340px;
      margin-bottom: 40px;
    }

    .security-badges {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(14,165,233,0.08);
      border: 1px solid rgba(14,165,233,0.2);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .badge-icon { font-size: 18px; flex-shrink: 0; }

    /* Right panel */
    .form-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 40px;
      background: var(--bg);
    }

    .form-card { width: 100%; max-width: 400px; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      margin-bottom: 32px;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--accent2); }

    .form-card h2 {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .email-display {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .email-display strong {
      color: var(--accent2);
      font-weight: 600;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--surface);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      letter-spacing: 2px;
    }

    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(14,165,233,0.15);
    }

    input[type="password"]::placeholder {
      color: var(--muted);
      letter-spacing: normal;
      opacity: 0.5;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      letter-spacing: 0.2px;
      box-shadow: 0 0 24px rgba(14,165,233,0.35);
    }

    button[type="submit"]:hover {
      background: #0284c7;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(14,165,233,0.45);
    }

    #status {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      min-height: 20px;
    }

    @media (max-width: 768px) {
      body { grid-template-columns: 1fr; }
      .hero-panel { display: none; }
      .form-panel { padding: 40px 24px; }
    }
  </style>
</head>
<body>

  <div class="hero-panel">
    <a class="logo" href="/homepage.html">
      <span class="logo-text">entri</span>
    </a>
    <div class="hero-content">
      <h1 class="hero-title">Welcome<br>back to <span>Entri.</span></h1>
      <p class="hero-sub">Sign in securely to access your verified identity profile and event tickets.</p>
      <div class="security-badges">
        <div class="badge">
          <span class="badge-icon">🔐</span>
          End-to-end encrypted session
        </div>
        <div class="badge">
          <span class="badge-icon">🛡️</span>
          Biometric identity verification
        </div>
        <div class="badge">
          <span class="badge-icon">⚡</span>
          Instant event access after login
        </div>
      </div>
    </div>
  </div>

  <div class="form-panel">
    <div class="form-card">
      <a class="back-link" href="/homepage.html">← Back</a>
      <h2>Sign In</h2>
      <p class="email-display" id="emailDisplay">Signing in as <strong id="emailLabel">—</strong></p>

      <form id="loginForm">
        <input type="hidden" id="email" value="">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter your password">
        <button type="submit">Sign In →</button>
      </form>
      <div id="status"></div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get("email") || "";
    document.getElementById("email").value = email;
    document.getElementById("emailLabel").textContent = email || "unknown";

    const form = document.getElementById("loginForm");
    const statusDiv = document.getElementById("status");

    form.onsubmit = async (e) => {
      e.preventDefault();
      statusDiv.style.color = "#38bdf8";
      statusDiv.textContent = "Signing in...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
          credentials: "include"
        });

        const data = await res.json();

        if (res.ok) {
          statusDiv.style.color = "#059669";
          statusDiv.textContent = "Login successful! Redirecting...";

          const redirectUrl = data.role === "organizer"
            ? "/organizer.html"
            : "/dashboard.html";

          setTimeout(() => { window.location.href = redirectUrl; }, 1000);
        } else {
          statusDiv.style.color = "#DC2626";
          statusDiv.textContent = `Error: ${data.detail || data.message}`;
        }
      } catch (error) {
        statusDiv.style.color = "#DC2626";
        statusDiv.textContent = `Error: ${error.message}`;
      }
    };
  </script>
</body>
</html>
