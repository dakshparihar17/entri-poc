<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue Ticket | Entri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #030c16;
      --surface: #071828;
      --surface2: #0c1f32;
      --border: rgba(255,255,255,0.07);
      --accent: #0ea5e9;
      --accent2: #38bdf8;
      --green: #10b981;
      --text: #eef4ff;
      --muted: #5a7fa0;
    }

    html { background: #030c16; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(165deg, #030c16 0%, #020a13 55%, #040e1c 100%);
      min-height: 100vh;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: rgba(3,12,22,0.85);
      backdrop-filter: blur(20px);
      padding: 0 40px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-text {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--accent2); }

    main {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 24px;
      min-height: calc(100vh - 64px);
    }

    .issue-card {
      background: var(--surface);
      border-radius: 20px;
      border: 1px solid var(--border);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 40px rgba(14,165,233,0.06);
    }

    .card-top {
      background: linear-gradient(135deg, #071828 0%, #0c1f32 100%);
      border-bottom: 1px solid rgba(14,165,233,0.15);
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    .card-top::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 80% at 80% 20%, rgba(14,165,233,0.12) 0%, transparent 60%);
    }

    .card-top-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(14,165,233,0.12);
      border: 1px solid rgba(14,165,233,0.25);
      color: var(--accent2);
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .card-top h2 {
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
      position: relative;
      z-index: 1;
      margin-bottom: 6px;
    }

    .card-top p {
      font-size: 14px;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }

    .card-body { padding: 36px 32px; }

    .form-group { margin-bottom: 22px; }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--surface2);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      appearance: none;
    }

    .form-group select option {
      background: var(--surface2);
      color: var(--text);
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(14,165,233,0.15);
    }

    .form-group input::placeholder { color: var(--muted); opacity: 0.5; }

    .select-wrapper { position: relative; }

    .select-wrapper::after {
      content: '▾';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      font-size: 14px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      margin-top: 8px;
      box-shadow: 0 0 24px rgba(14,165,233,0.35);
    }

    .submit-btn:hover {
      background: #0284c7;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(14,165,233,0.45);
    }

    #status {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      display: none;
      line-height: 1.5;
    }

    #status.success {
      display: block;
      background: rgba(16,185,129,0.1);
      color: var(--green);
      border: 1px solid rgba(16,185,129,0.25);
    }

    #status.error {
      display: block;
      background: rgba(220,38,38,0.1);
      color: #f87171;
      border: 1px solid rgba(220,38,38,0.2);
    }

    #status.loading {
      display: block;
      background: rgba(14,165,233,0.1);
      color: var(--accent2);
      border: 1px solid rgba(14,165,233,0.2);
    }

    @media (max-width: 600px) {
      header { padding: 0 16px; }
      main { padding: 32px 16px; }
      .card-body { padding: 28px 20px; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="/homepage.html">
      <span class="logo-text">entri</span>
    </a>
    <a class="back-link" href="/dashboard.html">← Back to Dashboard</a>
  </header>

  <main>
    <div class="issue-card">
      <div class="card-top">
        <div class="card-top-badge">🎟️ Ticket Generation</div>
        <h2>Generate Event Ticket</h2>
        <p>Issue a ticket to access an event with your verified identity.</p>
      </div>

      <div class="card-body">
        <form id="ticketForm">
          <div class="form-group">
            <label>Your Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label>Select Event</label>
            <div class="select-wrapper">
              <select id="eventSelect" required>
                <option value="">Loading events...</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Ticket Serial Number</label>
            <input type="text" id="ticketId" placeholder="e.g. 001" required>
          </div>

          <button type="submit" class="submit-btn">Generate Ticket →</button>
        </form>

        <div id="status"></div>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("ticketForm");
    const statusDiv = document.getElementById("status");
    const emailInput = document.getElementById("email");
    const eventSelect = document.getElementById("eventSelect");

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("email")) emailInput.value = urlParams.get("email");

    (async () => {
      try {
        const resEvents = await fetch("/events");
        if (!resEvents.ok) throw new Error("Cannot fetch events.");
        const allEvents = await resEvents.json();

        eventSelect.innerHTML = "";
        if (allEvents.length === 0) {
          eventSelect.innerHTML = '<option value="">No events available.</option>';
        } else {
          eventSelect.innerHTML = '<option value="">Select an event</option>';
          allEvents.forEach(ev => {
            const opt = document.createElement("option");
            opt.value = ev.event_code;
            opt.textContent = `${ev.event_name} (${ev.event_code})`;
            eventSelect.appendChild(opt);
          });
        }
      } catch (err) {
        statusDiv.className = "error";
        statusDiv.textContent = `Error: ${err.message}`;
        eventSelect.innerHTML = '<option value="">Error loading events</option>';
      }
    })();

    form.onsubmit = async (e) => {
      e.preventDefault();
      statusDiv.className = "loading";
      statusDiv.textContent = "Processing ticket...";

      const userEmail = emailInput.value.trim();
      const ticketId = document.getElementById("ticketId").value.trim();
      const eventCode = eventSelect.value;

      if (!userEmail || !ticketId || !eventCode) {
        statusDiv.className = "error";
        statusDiv.textContent = "Please fill all fields.";
        return;
      }

      try {
        const res = await fetch("/issue.html", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_email: userEmail, ticket_id: ticketId, event_code: eventCode })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to create ticket.");

        const selectedEvent = eventSelect.options[eventSelect.selectedIndex].text;
        statusDiv.className = "success";
        statusDiv.innerHTML = `
          ✓ Ticket for <strong>${selectedEvent}</strong> (No. ${data.ticket_number}) issued successfully!<br>
          <small>Added on: ${new Date(data.date_added).toLocaleString()}</small>
        `;

        setTimeout(() => { window.location.href = "/dashboard.html"; }, 2000);
        form.reset();
      } catch (err) {
        statusDiv.className = "error";
        statusDiv.textContent = `Error: ${err.message}`;
      }
    };
  </script>

</body>
</html>
