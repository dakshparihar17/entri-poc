<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Event Ticket</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .ticket-container {
        background: white;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        width: 400px;
    }

    h2 { text-align: center; margin-bottom: 20px; color: #0078ff; }

    form { display: flex; flex-direction: column; }

    label { margin-top: 10px; font-weight: bold; }
    input, select {
        margin-top: 5px;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 1rem;
    }

    button {
        margin-top: 20px;
        padding: 12px;
        border: none;
        background: #0078ff;
        color: white;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        transition: background 0.3s;
    }

    button:hover { background: #005fcc; }

    #status {
        margin-top: 15px;
        text-align: center;
        font-weight: bold;
        font-size: 0.95rem;
    }
</style>
</head>
<body>

<div class="ticket-container">
    <h2>Generate Event Ticket</h2>

    <form id="ticketForm">
        <label for="email">Your Email:</label>
        <input type="email" id="email" placeholder="user@example.com" required>

        <label for="eventSelect">Select Event:</label>
        <select id="eventSelect" required>
            <option value="">Loading events...</option>
        </select>

        <label for="ticketId">Ticket Number (Serial):</label>
        <input type="text" id="ticketId" placeholder="e.g. 001" required>

        <button type="submit">Generate Ticket</button>
    </form>

    <div id="status"></div>
</div>

<script>
const form = document.getElementById("ticketForm");
const statusDiv = document.getElementById("status");
const emailInput = document.getElementById("email");
const eventSelect = document.getElementById("eventSelect");

// Autofill email from query param (optional)
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("email")) emailInput.value = urlParams.get("email");

// Fetch all events for dropdown
(async () => {
    try {
        const resEvents = await fetch("/events");
        if (!resEvents.ok) throw new Error("Cannot fetch events.");
        const allEvents = await resEvents.json();

        eventSelect.innerHTML = "";
        if (allEvents.length === 0) {
            eventSelect.innerHTML = '<option value="">No events available.</option>';
        } else {
            eventSelect.innerHTML = '<option value="">Select an event</option>';
            allEvents.forEach(ev => {
                const opt = document.createElement("option");
                opt.value = ev.event_code;
                opt.textContent = `${ev.event_name} (${ev.event_code})`;
                eventSelect.appendChild(opt);
            });
        }
    } catch (err) {
        statusDiv.textContent = `❌ ${err.message}`;
        statusDiv.style.color = "red";
        eventSelect.innerHTML = '<option value="">Error loading events</option>';
    }
})();

// Handle form submission
form.onsubmit = async (e) => {
    e.preventDefault();
    statusDiv.style.color = "blue";
    statusDiv.textContent = "Processing ticket...";

    const userEmail = emailInput.value.trim();
    const ticketId = document.getElementById("ticketId").value.trim();
    const eventCode = eventSelect.value;

    if (!userEmail || !ticketId || !eventCode) {
        statusDiv.textContent = "Please fill all fields.";
        statusDiv.style.color = "red";
        return;
    }

    try {
        const res = await fetch("/issue.html", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                user_email: userEmail,
                ticket_id: ticketId,
                event_code: eventCode
            })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to create ticket.");

        statusDiv.style.color = "green";
        const selectedEvent = eventSelect.options[eventSelect.selectedIndex].text;
        statusDiv.innerHTML = `
            ✅ Ticket for <strong>${selectedEvent}</strong> (No. ${data.ticket_number}) 
            has been successfully added!<br>
            <small>Added on: ${new Date(data.date_added).toLocaleString()}</small>
        `;

        // Redirect to dashboard after 2 seconds
        setTimeout(() => {
            window.location.href = "/dashboard.html";
        }, 2000);

        form.reset();

    } catch (err) {
        statusDiv.textContent = `❌ ${err.message}`;
        statusDiv.style.color = "red";
    }
};
</script>

</body>
</html>
